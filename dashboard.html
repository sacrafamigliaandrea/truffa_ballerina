<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<title>Dashboard Docente — Il Voto che Ruba</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
body{margin:0;font-family:'DM Sans',system-ui,-apple-system,sans-serif;background:linear-gradient(135deg,#0c2554 0%,#173886 55%,#1d4ba8 100%);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;color:#0c2554;}
.login{background:#fff;border-radius:18px;padding:36px 38px 30px;box-shadow:0 30px 80px rgba(0,0,0,0.35);max-width:480px;width:100%;}
.brand{display:flex;align-items:center;gap:14px;margin-bottom:22px;padding-bottom:18px;border-bottom:1px solid #e7eaf2;}
.logo{width:48px;height:48px;background:#173886;border-radius:11px;display:flex;align-items:center;justify-content:center;color:#fff;}
.logo svg{width:26px;height:26px;fill:currentColor;}
.school{font-weight:600;font-size:15px;line-height:1.2;}
.sub{font-size:11px;color:#5a6680;letter-spacing:0.3px;text-transform:uppercase;margin-top:2px;}
h1{font-size:24px;letter-spacing:-0.5px;margin:0 0 6px;font-weight:700;}
h1 em{color:#c73a3a;font-style:normal;}
.intro{font-size:14px;color:#465070;line-height:1.5;margin:0 0 22px;}
label{display:block;font-size:12px;font-weight:600;color:#173886;letter-spacing:0.4px;text-transform:uppercase;margin-bottom:6px;}
input{width:100%;padding:12px 14px;border:1.5px solid #d4d9e6;border-radius:9px;font:inherit;font-size:15px;color:#0c2554;background:#fafbfd;margin-bottom:14px;transition:border-color .15s, box-shadow .15s;}
input:focus{outline:none;border-color:#173886;background:#fff;box-shadow:0 0 0 3px rgba(23,56,134,0.12);}
button{width:100%;padding:13px;background:#173886;color:#fff;border:none;border-radius:10px;font:inherit;font-size:15px;font-weight:600;cursor:pointer;letter-spacing:0.3px;transition:background .15s, transform .1s;}
button:hover:not(:disabled){background:#0c2554;}
button:active:not(:disabled){transform:scale(0.99);}
button:disabled{background:#c5cbda;cursor:not-allowed;}
.msg{font-size:13px;margin-top:14px;text-align:center;min-height:18px;line-height:1.4;}
.err{color:#c73a3a;font-weight:600;}
.loading{color:#5a6680;}
.spinner{display:inline-block;width:12px;height:12px;border:2px solid rgba(90,102,128,0.25);border-top-color:#173886;border-radius:50%;animation:spin 0.8s linear infinite;vertical-align:middle;margin-right:6px;}
@keyframes spin{to{transform:rotate(360deg);}}
.note{font-size:11px;color:#7a8499;margin-top:18px;text-align:center;line-height:1.5;letter-spacing:0.2px;}
</style>
</head>
<body>

<div class="login" id="loginBox">
  <div class="brand">
    <div class="logo"><svg viewBox="0 0 24 24"><path d="M12 2L2 7v10l10 5 10-5V7L12 2zm0 2.18L20 8.5v7L12 19.82 4 15.5v-7L12 4.18z"/><path d="M12 8a3 3 0 100 6 3 3 0 000-6z"/></svg></div>
    <div><div class="school">Sacra Famiglia</div><div class="sub">Dashboard Docente</div></div>
  </div>
  <h1>Il Voto che <em>Ruba</em></h1>
  <p class="intro">Accesso riservato al docente. Inserisci la password per visualizzare i dati raccolti durante l'attivita'.</p>
  <label for="pwd">Password</label>
  <input type="password" id="pwd" autocomplete="current-password" autofocus>
  <button id="btn" onclick="decifra()">Entra</button>
  <div class="msg" id="msg"></div>
  <div class="note">Protetto con AES-256-GCM &middot; PBKDF2 250.000 iter SHA-256</div>
</div>

const PBKDF2_ITER=250000;
const SALT_LEN=16;
const IV_LEN=12;

function b642buf(b64){
  const bin=atob(b64);
  const bytes=new Uint8Array(bin.length);
  // Loop esplicito (evita stack overflow su Safari con buffer grandi)
  for(let i=0;i<bin.length;i++)bytes[i]=bin.charCodeAt(i);
  return bytes;
}

async function deriveKey(pwd,salt){
  const enc=new TextEncoder();
  const keyMat=await crypto.subtle.importKey('raw',enc.encode(pwd),{name:'PBKDF2'},false,['deriveKey']);
  return crypto.subtle.deriveKey(
    {name:'PBKDF2',salt:salt,iterations:PBKDF2_ITER,hash:'SHA-256'},
    keyMat,
    {name:'AES-GCM',length:256},
    false,
    ['decrypt']
  );
}

async function decifra(){
  const msg=document.getElementById('msg');
  const btn=document.getElementById('btn');
  const pwd=document.getElementById('pwd').value;
  if(!pwd){msg.innerHTML='<span class="err">Inserisci la password</span>';return;}
  btn.disabled=true;
  msg.innerHTML='<span class="loading"><span class="spinner"></span>Decifratura in corso...</span>';

  try{
    if(BLOB_B64==='PLACEHOLDER_BLOB_AES'){
      throw new Error('Dashboard non ancora cifrata. Apri cripta-dashboard.html, genera il blob e sostituisci PLACEHOLDER_BLOB_AES in questo file.');
    }
    const buf=b642buf(BLOB_B64);
    if(buf.length<=SALT_LEN+IV_LEN)throw new Error('Blob malformato');
    const salt=buf.slice(0,SALT_LEN);
    const iv=buf.slice(SALT_LEN,SALT_LEN+IV_LEN);
    const ct=buf.slice(SALT_LEN+IV_LEN);

    const key=await deriveKey(pwd,salt);
    const plainBuf=await crypto.subtle.decrypt({name:'AES-GCM',iv:iv},key,ct);
    const plain=new TextDecoder().decode(plainBuf);

    // Sostituisce l'intera pagina con la dashboard
    document.open();
    document.write(plain);
    document.close();
  }catch(e){
    if(/PLACEHOLDER|malformato/i.test(e.message)){
      msg.innerHTML='<span class="err">'+e.message+'</span>';
    }else{
      msg.innerHTML='<span class="err">Password errata.</span>';
    }
    btn.disabled=false;
    document.getElementById('pwd').select();
  }
}

document.getElementById('pwd').addEventListener('keydown',function(e){
  if(e.key==='Enter'){e.preventDefault();decifra();}
});
</script>
